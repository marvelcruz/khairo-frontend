name: Fix Khairo client login production build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-khairo-client-login.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch client type and login error handling
        run: |
          python - <<'PY'
          from pathlib import Path

          # Fix the production TypeScript build blocker introduced by the
          # calorie calculator commit: the UI reads client.calorieCalculation,
          # so the field belongs on Client (not only DailyLog).
          client_page = Path('src/app/dashboard/clients/[id]/page.tsx')
          s = client_page.read_text(encoding='utf-8')
          before_daily_log = s.split('type DailyLog = {', 1)[0]
          if 'calorieCalculation?: {' not in before_daily_log:
              marker = '  currentWeightKg?: number;\n'
              addition = '''  calorieCalculation?: {\n    gender?: string;\n    age?: number;\n    heightCm?: number;\n    weightKg?: number;\n    activityLevel?: string;\n    tdeeKcal?: number;\n    updatedAt?: string;\n  };\n'''
              if marker not in s:
                  raise SystemExit('Client type marker not found')
              s = s.replace(marker, marker + addition, 1)
              client_page.write_text(s, encoding='utf-8')

          # ClientAuthContext throws an Error decorated with code/status rather
          # than lib/api's ApiError class. Read those properties structurally so
          # the client sees the real backend reason instead of a generic error.
          login_page = Path('src/app/portal/login/page.tsx')
          s = login_page.read_text(encoding='utf-8')
          s = s.replace('import { ApiError } from "../../../lib/api";\n', '')
          old = '''    } catch (err) {\n      const message = err instanceof ApiError ? err.message : "Unable to sign in. Please try again.";\n      setError(message);\n      if (err instanceof ApiError && err.code) setErrorCode(err.code);\n      else if (message.includes("No account")) setErrorCode("NO_ACCOUNT");\n      else if (message.includes("activated")) setErrorCode("NOT_ACTIVATED");\n      else if (message.includes("Incorrect")) setErrorCode("WRONG_PASSWORD");\n'''
          new = '''    } catch (err) {\n      const loginError = err instanceof Error\n        ? (err as Error & { code?: string; status?: number })\n        : null;\n      const message = loginError?.message || "Unable to sign in. Please try again.";\n      setError(message);\n      if (loginError?.code) setErrorCode(loginError.code);\n      else if (message.includes("No account")) setErrorCode("NO_ACCOUNT");\n      else if (message.includes("activated")) setErrorCode("NOT_ACTIVATED");\n      else if (message.includes("Incorrect")) setErrorCode("WRONG_PASSWORD");\n'''
          if old not in s:
              raise SystemExit('Login error block not found')
          s = s.replace(old, new, 1)
          login_page.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit repaired production files
        run: |
          rm -f .github/workflows/fix-khairo-client-login.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: unblock Khairo client portal login deployment"
          git push origin HEAD:main
