name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5001/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Reject direct application fetch calls
        shell: bash
        run: |
          matches=$(grep -RInE --include='*.ts' --include='*.tsx' '(^|[^A-Za-z])fetch\(' src \
            | grep -v '^src/lib/api.ts:' \
            | grep -v '\.test\.tsx\?:' \
            || true)
          if [ -n "$matches" ]; then
            echo "Application API calls must go through src/lib/api.ts so cookie auth and global error handling stay consistent."
            echo "$matches"
            exit 1
          fi

      - name: Unit and integration tests with coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build
