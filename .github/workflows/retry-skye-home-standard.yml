name: Retry Skye homepage standard

on:
  push:
    branches:
      - feature/skye-home-standard
    paths:
      - '.github/workflows/retry-skye-home-standard.yml'

permissions:
  contents: write

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/skye-home-standard
          fetch-depth: 0

      - name: Run homepage generator from bootstrap workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/apply-skye-home-standard.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install Lenis"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end].splitlines())
          exec(compile(code, 'skye-home-standard-generator.py', 'exec'))
          PY

      - name: Patch pre-existing Client calorie calculation type
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/dashboard/clients/[id]/page.tsx')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              marker = '  currentWeightKg?: number;\n'
              if 'type Client = {' in s and 'calorieCalculation?: {' not in s.split('type DailyLog = {', 1)[0]:
                  addition = '''  calorieCalculation?: {\n    gender?: string;\n    age?: number;\n    heightCm?: number;\n    weightKg?: number;\n    activityLevel?: string;\n    tdeeKcal?: number;\n    updatedAt?: string;\n  };\n'''
                  s = s.replace(marker, marker + addition, 1)
                  p.write_text(s, encoding='utf-8')
          PY

      - name: Install Lenis
        run: npm install lenis@^1.3.26 --save

      - name: Build
        run: npm run build

      - name: Commit standardized homepage
        run: |
          rm -f .github/workflows/retry-skye-home-standard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Standardize homepage with Skye design system"
          git push origin HEAD:feature/skye-home-standard
